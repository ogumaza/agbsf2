# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
          - name: Windows x86-64 clang-cl
            os: windows-2025
            cmake-args: -A x64 -T ClangCL
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: ./externals/xsflib/ci/build-and-test
        with:
          cmake: -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.cmake-args }}
          test-jobs: "1"
