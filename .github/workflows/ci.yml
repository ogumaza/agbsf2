# SPDX-License-Identifier: MIT

# Builds agbsf2 for each push to main that changes more than docs: on macOS ARM64, and on 64-bit Windows with
# clang-cl. Only the Windows job runs the tests. The macOS job builds Release without them (AGBSF2_BUILD_TESTS=OFF).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            cmake-args: -DAGBSF2_BUILD_TESTS=OFF
          - name: Windows x86-64 clang-cl
            os: windows-2025
            cmake-args: -A x64 -T ClangCL
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./externals/xsflib/ci/build-and-test
        with:
          cmake: -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ matrix.cmake-args }}
          test-jobs: "1"
