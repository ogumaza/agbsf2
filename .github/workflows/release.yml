# SPDX-License-Identifier: MIT

# A vX.Y.Z tag publishes a Windows x64 release. X.Y.Z must match CMakeLists.txt, with notes in
# docs/release-notes/X.Y.Z.md. The agbsf2-X.Y.Z-win-x64.zip package contains agbsf2.exe, README.md, LICENSE and
# THIRD_PARTY_NOTICES.
#
# A manual run (Actions > Release > Run workflow) builds the same zip and uploads it as a workflow artifact, without
# publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read the version and check for a matching tag and release notes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - id: version
        uses: ./externals/xsflib/ci/release-version
        with:
          project: agbsf2

  windows:
    needs: version
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./externals/xsflib/ci/release-windows
        with:
          version: ${{ needs.version.outputs.version }}
          cmake: -A x64 -T ClangCL -DAGBSF2_BUILD_TESTS=OFF
          targets: agbsf2
          programs: agbsf2
          files: build/Release/agbsf2.exe
          artifact: win-x64

  package:
    needs: [version, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./externals/xsflib/ci/package-converter
        with:
          program: agbsf2
          version: ${{ needs.version.outputs.version }}
          documents: README.md LICENSE THIRD_PARTY_NOTICES

      - uses: ./externals/xsflib/ci/release-publish
        with:
          title: agbsf2
          version: ${{ needs.version.outputs.version }}
          artifact: agbsf2-${{ needs.version.outputs.version }}
